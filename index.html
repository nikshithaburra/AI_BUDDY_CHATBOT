<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Buddy — a companion that actually answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;1,9..144,420&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:        #0e1210;
    --panel:      #161b18;
    --panel-2:    #1c221e;
    --line:       #2b322c;
    --line-soft:  #232a25;
    --paper:      #eee9de;
    --paper-dim:  #a7ab9f;
    --gold:       #c6a24d;
    --gold-dim:   #8d774a;
    --err:        #b5624a;
    --radius:     3px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--ink); }

  a, button{ font-family:inherit; }
  button{ cursor:pointer; background:none; border:none; color:inherit; }
  button:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible{
    outline: 1px solid var(--gold);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  .app{
    display:grid;
    grid-template-columns: 258px 1fr;
    height:100vh;
    height:100dvh;
  }

  /* ---------- SIDEBAR ---------- */
  .rail{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .mark{
    padding: 28px 24px 20px;
    border-bottom:1px solid var(--line-soft);
  }
  .mark-word{
    font-family:var(--serif);
    font-style:italic;
    font-weight:480;
    font-size:22px;
    letter-spacing:0.2px;
    color:var(--paper);
  }
  .mark-sub{
    margin-top:4px;
    font-size:11.5px;
    color:var(--paper-dim);
    letter-spacing:0.3px;
  }

  .new-entry{
    margin:18px 20px 8px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border:1px solid var(--gold-dim);
    border-radius:var(--radius);
    color:var(--gold);
    font-size:13.5px;
    text-align:left;
    transition: border-color .15s ease, background .15s ease;
  }
  .new-entry:hover{ border-color:var(--gold); background:rgba(198,162,77,0.06); }
  .new-entry .plus{ font-family:var(--serif); font-size:17px; line-height:1; }

  .ledger-label{
    margin:22px 20px 6px;
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:0.4px;
  }

  .ledger{
    flex:1;
    overflow-y:auto;
    padding: 0 8px 16px;
  }
  .ledger::-webkit-scrollbar{ width:8px; }
  .ledger::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  .entry{
    display:flex;
    gap:12px;
    align-items:baseline;
    width:100%;
    padding:10px 12px;
    border-radius:var(--radius);
    color:var(--paper-dim);
    text-align:left;
    border-left:2px solid transparent;
  }
  .entry:hover{ background:var(--panel-2); }
  .entry.active{
    background:var(--panel-2);
    color:var(--paper);
    border-left:2px solid var(--gold);
  }
  .entry-no{
    font-family:var(--serif);
    font-style:italic;
    font-size:13px;
    color:var(--gold-dim);
    flex-shrink:0;
    width:20px;
  }
  .entry.active .entry-no{ color:var(--gold); }
  .entry-title{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .rail-foot{
    border-top:1px solid var(--line-soft);
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:var(--paper-dim);
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background:#7fae86;
    box-shadow: 0 0 0 3px rgba(127,174,134,0.15);
    flex-shrink:0;
  }

  /* ---------- MAIN ---------- */
  .desk{
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100%;
  }
  .desk-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 40px 18px;
    border-bottom:1px solid var(--line-soft);
    flex-shrink:0;
  }
  .desk-head h1{
    margin:0;
    font-family:var(--serif);
    font-weight:420;
    font-size:20px;
    font-style:italic;
    color:var(--paper);
  }
  .desk-head .meta{
    font-size:12px;
    color:var(--paper-dim);
    margin-top:3px;
  }
  .menu-toggle{
    display:none;
    color:var(--paper-dim);
    font-size:20px;
    padding:4px 8px;
  }

  .correspondence{
    flex:1;
    overflow-y:auto;
    padding: 36px 0 20px;
  }
  .correspondence::-webkit-scrollbar{ width:8px; }
  .correspondence::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  .thread{
    max-width:680px;
    margin:0 auto;
    padding:0 40px;
    display:flex;
    flex-direction:column;
    gap:34px;
  }

  .msg{ display:flex; flex-direction:column; max-width:100%; }
  .msg .who{
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  .msg .body{
    font-size:15.5px;
    line-height:1.7;
    color:var(--paper);
    white-space:pre-wrap;
  }
  .msg .body p{ margin:0 0 12px; }
  .msg .body p:last-child{ margin-bottom:0; }

  .msg.user{
    align-self:flex-end;
    text-align:right;
    max-width:82%;
    padding-right:18px;
    border-right:2px solid var(--gold-dim);
  }
  .msg.user .who{ text-align:right; }

  .msg.bot{
    align-self:flex-start;
    max-width:100%;
    padding-left:18px;
    border-left:2px solid var(--line);
  }

  .msg.bot .body::first-letter{
    font-family:var(--serif);
    font-size:2.1em;
    font-style:italic;
    color:var(--gold);
    float:left;
    line-height:0.75;
    margin:6px 6px 0 0;
  }

  .composing{
    align-self:flex-start;
    padding-left:18px;
    border-left:2px solid var(--line);
    font-size:13px;
    font-style:italic;
    font-family:var(--serif);
    color:var(--paper-dim);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .composing .dots span{
    display:inline-block;
    width:4px; height:4px;
    background:var(--gold-dim);
    border-radius:50%;
    margin-right:3px;
    animation: pulse 1.2s infinite ease-in-out;
  }
  .composing .dots span:nth-child(2){ animation-delay:.2s; }
  .composing .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes pulse{
    0%, 60%, 100%{ opacity:0.25; }
    30%{ opacity:1; }
  }

  /* ---------- COMPOSER ---------- */
  .composer-wrap{
    border-top:1px solid var(--line-soft);
    padding: 18px 40px 24px;
    flex-shrink:0;
  }
  .composer{
    max-width:680px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:border-color .15s ease;
  }
  .composer:focus-within{ border-color:var(--gold-dim); }

  .composer textarea{
    background:none;
    border:none;
    color:var(--paper);
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.55;
    resize:none;
    max-height:180px;
    min-height:24px;
  }
  .composer textarea::placeholder{ color:var(--paper-dim); }

  .composer-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .composer-hint{
    font-size:11.5px;
    color:var(--paper-dim);
  }
  .composer-hint kbd{
    font-family:var(--sans);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 5px;
    font-size:10.5px;
  }
  .send{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border:1px solid var(--gold-dim);
    border-radius:var(--radius);
    color:var(--gold);
    font-size:13px;
    transition: border-color .15s ease, background .15s ease, opacity .15s ease;
  }
  .send:hover:not(:disabled){ border-color:var(--gold); background:rgba(198,162,77,0.08); }
  .send:disabled{ opacity:0.35; cursor:default; }
  .send svg{ width:13px; height:13px; }

  /* ---------- MOBILE ---------- */
  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; }
    .rail{
      position:fixed;
      inset:0 30% 0 0;
      z-index:20;
      transform:translateX(-100%);
      transition:transform .25s ease;
      box-shadow: 20px 0 40px rgba(0,0,0,0.4);
    }
    .rail.open{ transform:translateX(0); }
    .menu-toggle{ display:block; }
    .desk-head{ padding:18px 20px; }
    .correspondence{ padding-top:24px; }
    .thread{ padding:0 20px; }
    .composer-wrap{ padding:14px 16px 18px; }
    .scrim{
      display:none;
      position:fixed; inset:0;
      background:rgba(0,0,0,0.45);
      z-index:15;
    }
    .scrim.show{ display:block; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="mark">
      <div class="mark-word">AI Buddy</div>
      <div class="mark-sub">ask it anything, it'll tell you straight</div>
    </div>

    <button class="new-entry" id="newEntry">
      <span class="plus">+</span> Begin a new entry
    </button>

    <div class="ledger-label">Ledger</div>
    <nav class="ledger" id="ledger"></nav>

    <div class="rail-foot">
      <span class="status-dot"></span>
      In residence — replies within moments
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="desk">
    <header class="desk-head">
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Open ledger">☰</button>
        <div>
          <h1 id="sessionTitle">First entry</h1>
          <div class="meta" id="sessionMeta">Opened just now</div>
        </div>
      </div>
    </header>

    <div class="correspondence" id="correspondence">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask me anything…"></textarea>
        <div class="composer-foot">
          <span class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
          <button class="send" id="sendBtn" disabled>
            Send
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){

  // ---------- real answers, via our own /api/chat backend ----------
  async function getReply(history){
    // history: array of {role, text} in chronological order, most recent last
    const apiMessages = history.map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.text
    }));

    const response = await fetch("api/chat.js", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: apiMessages })
    });

    const data = await response.json();

    if (!response.ok){
      throw new Error(data.error || ("Request failed: " + response.status));
    }

    return data.reply;
  }

  // ---------- state ----------
  let sessions = [
    { id: 1, title: "First entry", messages: [], opened: "Opened just now" }
  ];
  let activeId = 1;
  let nextId = 2;

  const ledgerEl = document.getElementById('ledger');
  const threadEl = document.getElementById('thread');
  const titleEl = document.getElementById('sessionTitle');
  const metaEl = document.getElementById('sessionMeta');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const correspondenceEl = document.getElementById('correspondence');
  const railEl = document.getElementById('rail');
  const scrimEl = document.getElementById('scrim');

  function getSession(id){ return sessions.find(s => s.id === id); }

  function renderLedger(){
    ledgerEl.innerHTML = '';
    sessions.slice().reverse().forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'entry' + (s.id === activeId ? ' active' : '');
      btn.innerHTML = `<span class="entry-no">${String(s.id).padStart(2,'0')}</span><span class="entry-title">${escapeHtml(s.title)}</span>`;
      btn.addEventListener('click', () => switchSession(s.id));
      ledgerEl.appendChild(btn);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderThread(){
    const s = getSession(activeId);
    titleEl.textContent = s.title;
    metaEl.textContent = s.opened;
    threadEl.innerHTML = '';
    s.messages.forEach(m => threadEl.appendChild(buildMessageEl(m)));
    correspondenceEl.scrollTop = correspondenceEl.scrollHeight;
  }

  function buildMessageEl(m){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = m.role === 'user' ? 'You' : 'AI Buddy';
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = m.text;
    wrap.appendChild(who);
    wrap.appendChild(body);
    return wrap;
  }

  function switchSession(id){
    activeId = id;
    renderLedger();
    renderThread();
    if (window.innerWidth <= 820) closeRail();
  }

  function newSession(){
    const s = { id: nextId, title: "New entry", messages: [], opened: "Opened just now" };
    sessions.push(s);
    activeId = nextId;
    nextId++;
    renderLedger();
    renderThread();
    inputEl.focus();
    if (window.innerWidth <= 820) closeRail();
  }

  function titleFromText(text){
    const trimmed = text.trim().replace(/\s+/g, ' ');
    return trimmed.length > 34 ? trimmed.slice(0, 34) + '…' : trimmed;
  }

  function autosize(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    sendBtn.disabled = inputEl.value.trim().length === 0;
  }

  async function send(){
    const text = inputEl.value.trim();
    if (!text) return;
    const s = getSession(activeId);

    if (s.messages.length === 0) s.title = titleFromText(text);
    s.messages.push({ role:'user', text });
    renderLedger();
    renderThread();

    inputEl.value = '';
    autosize();
    sendBtn.disabled = true;

    showComposing();
    try {
      const reply = await getReply(s.messages);
      hideComposing();
      s.messages.push({ role:'bot', text: reply });
    } catch (err) {
      hideComposing();
      s.messages.push({ role:'bot', text: "That didn't go through on my end. Give it another try in a moment." });
      
    }
    renderThread();
    autosize();
  }

  function showComposing(){
    const el = document.createElement('div');
    el.className = 'composing';
    el.id = 'composingIndicator';
    el.innerHTML = 'composing a reply <span class="dots"><span></span><span></span><span></span></span>';
    threadEl.appendChild(el);
    correspondenceEl.scrollTop = correspondenceEl.scrollHeight;
  }
  function hideComposing(){
    const el = document.getElementById('composingIndicator');
    if (el) el.remove();
  }

  function openRail(){ railEl.classList.add('open'); scrimEl.classList.add('show'); }
  function closeRail(){ railEl.classList.remove('open'); scrimEl.classList.remove('show'); }

  // ---------- wiring ----------
  document.getElementById('newEntry').addEventListener('click', newSession);
  document.getElementById('menuToggle').addEventListener('click', openRail);
  scrimEl.addEventListener('click', closeRail);

  inputEl.addEventListener('input', autosize);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  // seed the first entry with a quiet welcome
  sessions[0].messages.push({
    role: 'bot',
    text: "I'm here — ask me anything, big or small. I'll give you a real answer, not a dodge."
  });

  renderLedger();
  renderThread();
  autosize();
})();
</script>

</body>
</html>
